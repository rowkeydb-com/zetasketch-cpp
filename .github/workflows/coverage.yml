name: Code Coverage

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Obtain CI Docker image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/ci
          IMAGE_VERSION: ${{ hashFiles('.github/Dockerfile.ci') }}-${{ runner.arch }}
          LOCAL_IMAGE: zetasketch-cpp-ci
          STAGE: base
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/obtain-ci-image.sh

      - name: Cache Bazel state
        uses: actions/cache@v4
        with:
          path: .bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ github.workflow }}-
            bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-

      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: .bazel-repos
          key: bazel-repos-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repos-${{ runner.arch }}-

      - name: Ensure Bazel cache directory exists
        run: mkdir -p .bazel-cache .bazel-repos

      - name: Generate coverage report
        # The script runs `bazel coverage` inside the CI container and
        # places the resulting lcov at ./coverage.lcov. If no test
        # targets exist yet, an empty coverage.lcov is produced.
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          BAZEL_FLAGS=""
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            BAZEL_FLAGS="--config=buildbuddy --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY --disk_cache="
          fi
          .github/scripts/run-bazel-in-docker.sh coverage coverage $BAZEL_FLAGS

      - name: Generate HTML report
        if: ${{ hashFiles('coverage.lcov') != '' }}
        run: |
          if [ -s coverage.lcov ]; then
            docker run --rm \
              -v "$PWD":/workspace \
              --user "$(id -u):$(id -g)" \
              -w /workspace zetasketch-cpp-ci \
              genhtml coverage.lcov -o coverage_html \
                --ignore-errors source,negative \
                --legend \
                --title "ZetaSketch C++ Coverage"
          else
            echo "Empty coverage.lcov; skipping HTML generation."
          fi

      - name: Upload to Codecov
        if: ${{ hashFiles('coverage.lcov') != '' && matrix.os == 'ubuntu-24.04' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov
          flags: unittests
          name: zetasketch-cpp-coverage
          # Surface upload failures as CI failures.
          fail_ci_if_error: true
          # Disable the default plugins (gcov auto-discovery, etc.).
          # Bazel produces the combined lcov in `coverage.lcov` and
          # the action's gcov plugin otherwise walks `.gcno` files
          # in `.cache/bazel/.../sandbox/...` whose corresponding
          # `coverage.dat` files have been cleaned up by the test
          # runner, crashing with FileNotFoundError. With noop we
          # upload only the explicit lcov file.
          plugins: noop
          disable_search: true

      - name: Upload HTML report
        if: ${{ hashFiles('coverage_html/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 30
