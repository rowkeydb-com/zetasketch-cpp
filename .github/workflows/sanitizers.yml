name: Sanitizers

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: ${{ matrix.config }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        config: [asan-ubsan, tsan]
        include:
          - os: ubuntu-24.04
            config: msan-amd64
          - os: ubuntu-24.04-arm
            config: msan-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Obtain CI Docker image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/ci
          IMAGE_VERSION: ${{ hashFiles('.github/Dockerfile.ci') }}-${{ runner.arch }}
          LOCAL_IMAGE: zetasketch-cpp-ci
          STAGE: ${{ startsWith(matrix.config, 'msan') && 'msan' || 'base' }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/obtain-ci-image.sh


      - name: Cache Bazel state
        uses: actions/cache@v4
        with:
          path: .bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ matrix.config }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ matrix.config }}-${{ github.workflow }}-
            bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ matrix.config }}-
            bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-

      - name: Ensure Bazel cache directory exists
        run: mkdir -p .bazel-cache

      - name: Execute Bazel test suite under ${{ matrix.config }} sanitizer
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          BAZEL_FLAGS=""
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            BAZEL_FLAGS="--config=buildbuddy --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY --disk_cache="
          fi
          .github/scripts/run-bazel-in-docker.sh ${{ matrix.config }} test $BAZEL_FLAGS
