name: Sanitizers

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: ${{ matrix.config }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        config: [asan-ubsan, tsan]
        include:
          - os: ubuntu-24.04
            config: msan-amd64
          - os: ubuntu-24.04-arm
            config: msan-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile.ci
          tags: zetasketch-cpp-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min


      - name: Cache Bazel state
        uses: actions/cache@v4
        with:
          path: .bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ matrix.os }}-${{ matrix.config }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ matrix.os }}-${{ matrix.config }}-${{ github.workflow }}-
            bazel-cache-${{ runner.os }}-${{ matrix.os }}-${{ matrix.config }}-
            bazel-cache-${{ runner.os }}-${{ matrix.os }}-

      - name: Ensure Bazel cache directory exists
        run: mkdir -p .bazel-cache

      - name: Execute Bazel test suite under ${{ matrix.config }} sanitizer
        run: .github/scripts/run-bazel-in-docker.sh ${{ matrix.config }} test
