name: Build and Test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (release) - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Obtain CI Docker image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/ci
          IMAGE_VERSION: ${{ hashFiles('.github/Dockerfile.ci') }}-${{ runner.arch }}
          LOCAL_IMAGE: zetasketch-cpp-ci
          STAGE: base
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/obtain-ci-image.sh


      - name: Cache Bazel state
        uses: actions/cache@v4
        with:
          path: .bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ github.workflow }}-
            bazel-cache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-

      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: .bazel-repos
          key: bazel-repos-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repos-${{ runner.arch }}-

      - name: Ensure Bazel cache directory exists
        run: mkdir -p .bazel-cache .bazel-repos

      - name: Execute Bazel release test suite
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          BAZEL_FLAGS=""
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            BAZEL_FLAGS="--config=buildbuddy --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY --disk_cache="
          fi
          .github/scripts/run-bazel-in-docker.sh release test $BAZEL_FLAGS
