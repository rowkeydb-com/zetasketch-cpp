codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "90...100"

  status:
    project:
      default:
        target: 100%
        threshold: 1%
        informational: false

    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false

comment:
  layout: "reach,diff,flags,tree,files"
  behavior: default
  require_changes: false

ignore:
  - "**/*_test.cpp"
  - "**/*_test.cc"
  - "**/testing/**"
  - "src/farmhash/**"
  - "src/proto/**"
  - "external/**"
  - "bazel-*/**"

flags:
  unittests:
    paths:
      - "src/**"
      - "include/**"
    carryforward: true
